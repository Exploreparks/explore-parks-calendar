name: Angels Landing lottery check
on:
  schedule:
    - cron: "17 14 * * *"   # daily
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: run
        run: python3 scripts/check_lottery.py
      - name: Commit updated status
        run: |
          git config user.name "explore-parks-bot"
          git config user.email "bot@users.noreply.github.com"
          git add zion/status.json
          git diff --cached --quiet || (git commit -m "Update Angels Landing lottery status" && git push)
      - name: Open an issue when the lottery status changes
        if: steps.run.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Angels Landing reservations: ${{ steps.run.outputs.state }}" \
            --body "${{ steps.run.outputs.note }} Apply: https://www.recreation.gov/permits/4675310 | NPS: https://www.nps.gov/zion/planyourvisit/angels-landing-hiking-permits.htm | Page: https://exploreparks.github.io/explore-parks-calendar/zion/"
